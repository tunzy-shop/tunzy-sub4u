<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TUNZY SUB</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Additional dashboard specific styles */
        .quick-actions {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin: 10px 0 20px;
            overflow-x: auto;
        }
        
        .quick-action {
            background: linear-gradient(135deg, var(--bg-gray), var(--bg-white));
            padding: 8px 20px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            border: 1px solid var(--border);
            color: var(--text-dark);
        }
        
        .section-title {
            padding: 0 20px;
            margin: 20px 0 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .transactions-list {
            padding: 0 20px;
        }
        
        .transaction-item {
            background: var(--bg-gray);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }
        
        .transaction-service {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .transaction-date {
            font-size: 11px;
            color: var(--text-light);
        }
        
        .transaction-amount {
            font-weight: 600;
            color: var(--primary-blue);
        }
        
        .transaction-amount.credit {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i>
    </div>
    
    <script>
        // Dark mode function
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }
        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
    
    <script src="js/firebase-config.js"></script>
    <div class="app-container">
        <div class="header">
            <div class="logo-circle">
                <img src="assets/T-logo.jpg" alt="TUNZY" onerror="this.innerHTML='<span class=\"logo-text\">T</span>'">
            </div>
            <span class="app-title">TUNZY SUB</span>
        </div>
        <div class="welcome-card">
            <div class="welcome-text">Welcome back,</div>
            <div class="user-name" id="userName">Loading...</div>
        </div>
        <div class="balance-card">
            <div class="balance-left">
                <div>
                    <div class="balance-label">Wallet Balance</div>
                    <div class="balance-amount" id="balanceAmount">₦0.00</div>
                </div>
                <button class="eye-btn" onclick="toggleBalance()" id="eyeBtn">👁️</button>
            </div>
            <button class="fund-btn" onclick="window.location.href='fund.html'">Fund</button>
        </div>
        
        <!-- Quick Actions -->
        <div class="quick-actions">
            <span class="quick-action">📱 Buy Data</span>
            <span class="quick-action">📞 Airtime</span>
            <span class="quick-action">💡 Electricity</span>
            <span class="quick-action">📺 TV</span>
        </div>
        
        <!-- Services Grid -->
        <div class="services-grid">
            <a href="buy-data.html" class="service-card">
                <div class="service-image"><img src="assets/buydata.png" alt="DATA" onerror="this.innerHTML='📱'"></div>
                <div class="service-title">DATA</div>
            </a>
            <a href="airtime.html" class="service-card">
                <div class="service-image"><img src="assets/airtime.png" alt="AIRTIME" onerror="this.innerHTML='📞'"></div>
                <div class="service-title">AIRTIME</div>
            </a>
            <a href="electricity.html" class="service-card">
                <div class="service-image"><img src="assets/electricity.png" alt="ELECTRICITY" onerror="this.innerHTML='💡'"></div>
                <div class="service-title">ELECTRICITY</div>
            </a>
            <a href="tv.html" class="service-card">
                <div class="service-image"><img src="assets/cabletv.png" alt="TV" onerror="this.innerHTML='📺'"></div>
                <div class="service-title">TV</div>
            </a>
            <a href="social.html" class="service-card">
                <div class="service-image"><img src="assets/social.png" alt="BOOST SOCIAL" onerror="this.innerHTML='📱'"></div>
                <div class="service-title">BOOST SOCIAL</div>
            </a>
            <a href="media.html" class="service-card">
                <div class="service-image"><img src="assets/media.png" alt="MEDIA" onerror="this.innerHTML='🎬'"></div>
                <div class="service-title">MEDIA</div>
            </a>
        </div>
        
        <!-- Recent Transactions -->
        <div class="section-title">Recent Transactions</div>
        <div class="transactions-list" id="transactionsList">
            <div class="transaction-item">
                <div><div class="transaction-service">No transactions yet</div></div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div>HOME</div>
        </a>
        <a href="history.html" class="nav-item">
            <div class="nav-icon">📊</div>
            <div>HISTORY</div>
        </a>
        <a href="support.html" class="nav-item">
            <div class="nav-icon">❓</div>
            <div>SUPPORT</div>
        </a>
        <a href="profile.html" class="nav-item">
            <div class="nav-icon">👤</div>
            <div>PROFILE</div>
        </a>
    </div>
    
    <script>
        let balanceVisible = true;
        
        auth.onAuthStateChanged((user) => {
            if (!user) window.location.href = 'login-page.html';
            else {
                document.getElementById('userName').innerText = user.displayName || user.email.split('@')[0];
                let balance = parseFloat(localStorage.getItem('userBalance')) || 0;
                document.getElementById('balanceAmount').innerText = `₦${balance.toLocaleString()}.00`;
                loadTransactions();
            }
        });
        
        function toggleBalance() {
            balanceVisible = !balanceVisible;
            let balance = parseFloat(localStorage.getItem('userBalance')) || 0;
            document.getElementById('balanceAmount').innerText = balanceVisible ? `₦${balance.toLocaleString()}.00` : '••••••';
            document.getElementById('eyeBtn').innerHTML = balanceVisible ? '👁️' : '👁️‍🗨️';
        }
        
        function loadTransactions() {
            let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            let container = document.getElementById('transactionsList');
            if (transactions.length === 0) return;
            let html = '';
            transactions.slice(0, 3).forEach(t => {
                let isCredit = t.amount && t.amount.startsWith('+');
                html += `<div class="transaction-item">
                            <div><div class="transaction-service">${t.type}</div><div class="transaction-date">${t.date || 'Just now'}</div></div>
                            <div class="transaction-amount ${isCredit ? 'credit' : ''}">${t.amount}</div>
                        </div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
